name: Build JARVIS DMG

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build app and DMG
        run: bash build_dmg.sh

      - name: Upload DMG
        uses: actions/upload-artifact@v4
        with:
          name: JARVIS-dmg
          path: dist/JARVIS.dmg
